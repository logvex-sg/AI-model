[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - a local-first Linux desktop AI assistant core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
name = "aegis"
version = "0.2.0"
description = "KALI-AEGIS — autonomous security and software engineering platform (leader/builder/pentester/executor) for authorized systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KALI-AEGIS" }]
keywords = ["security", "automation", "agents", "pentest", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools]
packages = [
    "aegis",
    "aegis.agents",
    "aegis.security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
